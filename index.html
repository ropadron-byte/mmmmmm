<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensaje Especial</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 30%, #f3e5f5 70%, #ede7f6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating decorations */
  .particle {
    position: fixed;
    pointer-events: none;
    animation: float linear infinite;
    opacity: 0;
    z-index: 0;
  }

  @keyframes float {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    5% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Envelope / Landing */
  .envelope-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    z-index: 10;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .envelope-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #c2185b;
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 1px 3px rgba(194, 24, 91, 0.15);
  }

  .envelope {
    width: 280px;
    height: 200px;
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border-radius: 20px;
    border: 2px solid #f8bbd0;
    box-shadow: 0 8px 40px rgba(233, 30, 99, 0.15), 0 2px 8px rgba(0,0,0,0.08);
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .envelope:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 16px 50px rgba(233, 30, 99, 0.2), 0 4px 12px rgba(0,0,0,0.1);
  }

  .envelope::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(160deg, #f8bbd0 0%, #fce4ec 50%);
    border-radius: 20px 20px 0 0;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transition: transform 0.4s ease;
  }

  .envelope-icon {
    font-size: 3.5rem;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(194,24,91,0.2));
  }

</body>
</html>
