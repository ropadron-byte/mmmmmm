<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 30%, #f3e5f5 70%, #ede7f6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating decorations */
  .particle {
    position: fixed;
    pointer-events: none;
    animation: float linear infinite;
    opacity: 0;
    z-index: 0;
  }

  @keyframes float {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    5% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Envelope / Landing */
  .envelope-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 10;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .envelope {
    width: 280px;
    height: 200px;
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border-radius: 20px;
    border: 2px solid #f8bbd0;
    box-shadow: 0 8px 40px rgba(233, 30, 99, 0.15), 0 2px 8px rgba(0,0,0,0.08);
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* Variables para la animación por clics */
    --current-scale: 1;
    transform: scale(var(--current-scale));
    transition: box-shadow 0.3s ease;
  }

  .envelope:hover {
    box-shadow: 0 16px 50px rgba(233, 30, 99, 0.2), 0 4px 12px rgba(0,0,0,0.1);
  }

  .envelope::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(160deg, #f8bbd0 0%, #fce4ec 50%);
    border-radius: 20px 20px 0 0;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
  }

  .envelope-icon {
    font-size: 4rem;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(194,24,91,0.2));
  }

  /* Animación de tambaleo al hacer clic */
  .wobble {
    animation: wobbleAnim 0.3s ease;
  }

  @keyframes wobbleAnim {
    0% { transform: scale(var(--current-scale)) rotate(0deg); }
    25% { transform: scale(var(--current-scale)) rotate(-6deg); }
    50% { transform: scale(var(--current-scale)) rotate(6deg); }
    75% { transform: scale(var(--current-scale)) rotate(-4deg); }
    100% { transform: scale(var(--current-scale)) rotate(0deg); }
  }

  .envelope-subtitle {
    font-size: 0.9rem;
    color: #ad1457;
    letter-spacing: 1px;
    opacity: 0.7;
    font-weight: bold;
  }

  /* Letter */
  .letter-wrapper {
    display: none;
    z-index: 10;
    width: 100%;
    max-width: 960px;
    padding: 20px;
    animation: openLetter 0.6s ease;
  }

  @keyframes openLetter {
    from { opacity: 0; transform: scale(0.92) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .letter-card {
    background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(255,240,248,0.95));
    border-radius: 28px;
    border: 1.5px solid rgba(248, 187, 208, 0.6);
    box-shadow:
      0 20px 60px rgba(194,24,91,0.12),
      0 4px 16px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    position: relative;
  }

  /* Decorative top border */
  .letter-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #f8bbd0, #ce93d8, #b39ddb, #f8bbd0);
  }

  .letter-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 500px;
  }

  /* Text side */
  .letter-text {
    padding: 48px 40px 40px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    border-right: 1px dashed rgba(248,187,208,0.5);
  }

  .letter-body {
    font-size: 1.05rem;
    line-height: 1.85;
    color: #5d4037;
  }

  .letter-body p {
    margin-bottom: 16px;
  }

  .letter-body p:last-child {
    margin-bottom: 0;
  }

  /* Image side */
  .letter-image {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #fce4ec, #f3e5f5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .letter-image img {
    width: 100%;
    max-width: 340px;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(194,24,91,0.18), 0 2px 8px rgba(0,0,0,0.1);
    object-fit: cover;
    position: relative;
    z-index: 2;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .letter-inner {
      grid-template-columns: 1fr;
    }
    .letter-text {
      padding: 36px 28px 28px 28px;
      border-right: none;
      border-bottom: 1px dashed rgba(248,187,208,0.5);
    }
    .letter-image {
      padding: 28px 20px 40px;
    }
  }
</style>
</head>
<body>

<div id="particles"></div>

<div class="envelope-wrapper" id="envelopeView">
  <div class="envelope" id="envelopeElement" onclick="hitEnvelope()">
    <span class="envelope-icon">💌</span>
  </div>
  <p class="envelope-subtitle" id="clickText">Toca el sobre varias veces</p>
</div>

<div class="letter-wrapper" id="letterView">
  <div class="letter-card">
    <div class="letter-inner">

      <div class="letter-text">
        <div class="letter-body">
          <p><strong>Te amo mucho amor, te quedo muy hermoso el dibujo :(</strong></p>
          <p><strong>Perdon si sentiste que no lo aprecie, lo aprecie mucho mi amor, te despliego esta pagina de disculpa amor, de verdad lo siento</strong></p>
          <p><strong>Te amo mucho mi vida, perdon porque tengas que tenerme paciencia siempre :(</strong></p>
        </div>
      </div>

      <div class="letter-image">
        <img src="dibujo.jpg" alt="Dibujo" />
      </div>

    </div>
  </div>
</div>

<script>
  // Crear partículas flotantes (Corazones blancos, tulipanes y estrellas platinadas/blancas)
  const symbols = ['🤍', '🌷', '✨', '⭐', '☁️', '🤍', '✨'];
  const container = document.getElementById('particles');

  function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + 'vw';
    
    // Si es estrella, hacerla un poco más pequeña
    if(p.textContent === '✨' || p.textContent === '⭐') {
        p.style.fontSize = (Math.random() * 10 + 8) + 'px';
        p.style.filter = 'grayscale(100%) brightness(150%)'; // Efecto platinado/blanco
    } else {
        p.style.fontSize = (Math.random() * 14 + 12) + 'px';
    }

    const dur = Math.random() * 10 + 12;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = Math.random() * 8 + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), (dur + 10) * 1000);
  }

  for (let i = 0; i < 20; i++) createParticle();
  setInterval(createParticle, 1500);

  // Lógica de clics para abrir el sobre
  let clicks = 0;
  const maxClicks = 5;
  const envelope = document.getElementById('envelopeElement');
  const clickText = document.getElementById('clickText');

  function hitEnvelope() {
    clicks++;
    
    // Agrandar ligeramente en cada clic
    let newScale = 1 + (clicks * 0.15);
    envelope.style.setProperty('--current-scale', newScale);
    
    // Reiniciar y aplicar animación de tambaleo
    envelope.classList.remove('wobble');
    void envelope.offsetWidth; // Forzar reinicio de animación
    envelope.classList.add('wobble');

    // Cambiar texto de ayuda según los clics
    if (clicks === 2) clickText.innerText = "¡Un poco más!";
    if (clicks === 4) clickText.innerText = "¡Ya casi!";

    // Si llega al máximo, abrir la carta
    if (clicks >= maxClicks) {
      setTimeout(() => {
        document.getElementById('envelopeView').style.display = 'none';
        const lv = document.getElementById('letterView');
        lv.style.display = 'block';
      }, 300); // Esperar a que termine el último tambaleo
    }
  }
</script>

</body>
</html>
